{% extends "base.html" %}

{% block title %}Folder Explorer - AbhiApp Vault{% endblock %}

{% block extra_head %}
<style>
  .folder-explorer-grid {
    display: grid;
    grid-template-columns: 240px 1fr;
    gap: 1.25rem;
    align-items: start;
    width: 100%;
    box-sizing: border-box;
  }

  @media (max-width: 768px) {
    .folder-explorer-grid {
      grid-template-columns: 1fr;
      gap: 1rem;
    }
    .folder-tree-sidebar {
      position: static !important;
      max-height: 220px !important;
    }
  }
</style>
{% endblock %}

{% block content %}
<div style="display:flex;flex-direction:column;gap:1.15rem;width:100%;box-sizing:border-box;">

  <!-- Header -->
  <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:0.75rem;">
    <div>
      <h1 style="font-size:1.35rem;font-weight:800;color:#fff;letter-spacing:-0.02em;">Folder Tree Explorer</h1>
      <p style="font-size:0.78rem;color:#94a3b8;margin-top:0.1rem;">Organize drawings, assemblies, and documents in nested hierarchies</p>
    </div>
    <div>
      <button class="btn btn-primary btn-sm" onclick="openCreateFolderModal(currentExplorerFolderId)">
        <span>+</span> New Folder
      </button>
    </div>
  </div>

  <!-- Breadcrumbs Bar -->
  <div class="glass-card" style="padding:0.6rem 1rem;display:flex;align-items:center;gap:0.5rem;font-size:0.85rem;overflow-x:auto;">
    <span style="color:#94a3b8;font-size:0.75rem;text-transform:uppercase;font-weight:600;">Path:</span>
    <div id="folderBreadcrumbs" style="display:flex;align-items:center;gap:0.35rem;overflow-x:auto;white-space:nowrap;">
      <span style="font-weight:700;color:#fff;">Root Directory</span>
    </div>
  </div>

  <!-- Main Folder Explorer Layout -->
  <div class="folder-explorer-grid" id="folderExplorerContainer">
    
    <!-- Left Tree Navigation -->
    <div class="glass-card folder-tree-sidebar" style="padding:0.85rem;position:sticky;top:80px;max-height:calc(100vh - 120px);overflow-y:auto;">
      <div style="font-size:0.72rem;font-weight:700;color:#94a3b8;text-transform:uppercase;margin-bottom:0.6rem;letter-spacing:0.06em;">Directory Structure</div>
      <div id="folderTreeNav">
        <!-- Tree rendered by folders.js -->
      </div>
    </div>

    <!-- Right Content Area -->
    <div class="glass-card" id="folderContentsContainer" style="padding:1.15rem;">
      <!-- Populated by folders.js -->
    </div>

  </div>

</div>
{% endblock %}

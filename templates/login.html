{% extends "base.html" %}

{% block title %}Sign In - AbhiApp Digital Vault{% endblock %}

{% block extra_head %}
<style>
  .auth-wrapper {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem 0.75rem;
    width: 100%;
    box-sizing: border-box;
  }
  .auth-card {
    max-width: 420px;
    width: 100%;
    padding: 1.75rem 1.35rem;
    position: relative;
    overflow: hidden;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    box-sizing: border-box;
  }
  @media (max-width: 480px) {
    .auth-card {
      padding: 1.35rem 1rem;
    }
  }
</style>
{% endblock %}

{% block auth_content %}
<div class="auth-wrapper">
  
  <div class="glass-card auth-card">
    
    <!-- Ambient glowing top line -->
    <div style="position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#6366f1 0%,#38bdf8 50%,#a855f7 100%);"></div>

    <!-- Brand Header -->
    <div style="text-align:center;margin-bottom:1.25rem;">
      <div class="brand-logo" style="width:48px;height:48px;font-size:1.4rem;margin:0 auto 0.6rem;border-radius:12px;">A</div>
      <h1 style="font-size:1.5rem;font-weight:800;letter-spacing:-0.03em;color:#fff;margin-bottom:0.15rem;">AbhiApp</h1>
      <p style="font-size:0.75rem;color:#38bdf8;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;">Your Personal Digital Vault</p>
    </div>

    <!-- Error Alert Banner -->
    <div id="authErrorBox" style="display:none;background:rgba(244,63,94,0.12);border:1px solid rgba(244,63,94,0.3);color:#fb7185;padding:0.6rem 0.85rem;border-radius:8px;font-size:0.78rem;margin-bottom:1rem;text-align:center;"></div>

    <!-- Tab Switcher -->
    <div style="display:flex;background:rgba(10,13,20,0.6);border:1px solid rgba(255,255,255,0.06);border-radius:10px;padding:3px;margin-bottom:1.25rem;">
      <button type="button" id="tabLoginBtn" class="filter-chip active" style="flex:1;text-align:center;border-radius:8px;padding:0.4rem;" onclick="switchAuthTab('login')">Sign In</button>
      <button type="button" id="tabRegisterBtn" class="filter-chip" style="flex:1;text-align:center;border-radius:8px;padding:0.4rem;" onclick="switchAuthTab('register')">Register</button>
    </div>

    <!-- 1. Sign In Form -->
    <div id="loginFormContainer">
      <form onsubmit="handleLoginSubmit(event)" style="display:flex;flex-direction:column;gap:0.95rem;">
        
        <div>
          <label style="font-size:0.75rem;font-weight:600;color:#94a3b8;display:block;margin-bottom:0.3rem;">Username or Email</label>
          <input type="text" id="loginIdentifier" class="global-search-input" style="padding-left:0.85rem;height:38px;" placeholder="Username or email" required autofocus>
        </div>

        <div>
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.3rem;">
            <label style="font-size:0.75rem;font-weight:600;color:#94a3b8;">Password</label>
            <button type="button" onclick="togglePasswordVisibility('loginPassword', this)" style="background:transparent;border:none;color:#38bdf8;font-size:0.72rem;cursor:pointer;">👁️ Show</button>
          </div>
          <input type="password" id="loginPassword" class="global-search-input" style="padding-left:0.85rem;height:38px;" placeholder="••••••••••••" required>
        </div>

        <div style="display:flex;align-items:center;justify-content:space-between;font-size:0.75rem;">
          <label style="display:flex;align-items:center;gap:0.4rem;color:#94a3b8;cursor:pointer;">
            <input type="checkbox" id="loginRemember" style="accent-color:#6366f1;">
            <span>Remember me</span>
          </label>
        </div>

        <button type="submit" class="btn btn-primary" style="padding:0.65rem;font-size:0.9rem;margin-top:0.25rem;font-weight:600;width:100%;">
          Sign In to Vault
        </button>

      </form>

      <!-- Direct Download Mobile App Link -->
      <div style="margin-top:1.15rem;text-align:center;padding-top:0.85rem;border-top:1px solid rgba(255,255,255,0.06);">
        <a href="/download-app" style="display:inline-flex;align-items:center;gap:0.35rem;color:#38bdf8;font-size:0.78rem;text-decoration:none;font-weight:600;">
          <span>📲</span>
          <span>Download & Install Mobile App</span>
        </a>
      </div>
    </div>

    <!-- 2. Register Form -->
    <div id="registerFormContainer" style="display:none;">
      <form onsubmit="handleRegisterSubmit(event)" style="display:flex;flex-direction:column;gap:0.95rem;">
        
        <div>
          <label style="font-size:0.75rem;font-weight:600;color:#94a3b8;display:block;margin-bottom:0.3rem;">Username</label>
          <input type="text" id="regUsername" class="global-search-input" style="padding-left:0.85rem;height:38px;" placeholder="Choose a username" required>
        </div>

        <div>
          <label style="font-size:0.75rem;font-weight:600;color:#94a3b8;display:block;margin-bottom:0.3rem;">Email Address</label>
          <input type="email" id="regEmail" class="global-search-input" style="padding-left:0.85rem;height:38px;" placeholder="you@domain.com" required>
        </div>

        <div>
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.3rem;">
            <label style="font-size:0.75rem;font-weight:600;color:#94a3b8;">Password</label>
            <button type="button" onclick="togglePasswordVisibility('regPassword', this)" style="background:transparent;border:none;color:#38bdf8;font-size:0.72rem;cursor:pointer;">👁️ Show</button>
          </div>
          <input type="password" id="regPassword" class="global-search-input" style="padding-left:0.85rem;height:38px;" placeholder="Min 6 chars" minlength="6" required>
        </div>

        <div>
          <label style="font-size:0.75rem;font-weight:600;color:#94a3b8;display:block;margin-bottom:0.3rem;">Confirm Password</label>
          <input type="password" id="regConfirmPassword" class="global-search-input" style="padding-left:0.85rem;height:38px;" placeholder="Confirm password" minlength="6" required>
        </div>

        <button type="submit" class="btn btn-primary" style="padding:0.65rem;font-size:0.9rem;margin-top:0.25rem;font-weight:600;width:100%;">
          Create Vault Account
        </button>

      </form>
    </div>

  </div>

</div>
{% endblock %}

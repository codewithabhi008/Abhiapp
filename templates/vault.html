{% extends "base.html" %}

{% block title %}All Files - AbhiApp Vault{% endblock %}

{% block content %}
<div style="display:flex;flex-direction:column;gap:1rem;width:100%;box-sizing:border-box;">

  <!-- Vault Header & Controls -->
  <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:0.75rem;width:100%;">
    <div style="min-width:0;">
      <div style="display:flex;align-items:center;gap:0.5rem;flex-wrap:wrap;">
        <h1 style="font-size:1.35rem;font-weight:800;color:#fff;letter-spacing:-0.02em;">Vault Explorer</h1>
        <span class="nav-badge" id="vaultFilesCountBadge" style="font-size:0.75rem;padding:2px 8px;">0 files</span>
      </div>
      <p style="font-size:0.75rem;color:#94a3b8;margin-top:0.1rem;">Manage, search, preview, and download your engineering documents</p>
    </div>

    <div class="vault-controls">
      <div style="display:flex;background:rgba(10,13,20,0.6);border:1px solid rgba(255,255,255,0.08);border-radius:8px;padding:2px;">
        <button id="btnViewGrid" class="btn btn-sm active" style="padding:3px 8px;border-radius:6px;" onclick="toggleVaultView('grid')" title="Grid View">
          ⊞ Grid
        </button>
        <button id="btnViewTable" class="btn btn-sm" style="padding:3px 8px;border-radius:6px;" onclick="toggleVaultView('table')" title="List View">
          ☰ List
        </button>
      </div>

      <select class="select-styled" onchange="setVaultSort(this.value)" style="padding:0.35rem 0.6rem;font-size:0.78rem;">
        <option value="date_desc">🕒 Newest</option>
        <option value="date_asc">🕒 Oldest</option>
        <option value="name_asc">🔤 A - Z</option>
        <option value="name_desc">🔤 Z - A</option>
        <option value="size_desc">📦 Largest</option>
        <option value="size_asc">📦 Smallest</option>
      </select>

      <button class="btn btn-primary btn-sm" onclick="openModal('uploadModal')">
        <span>+</span> Upload
      </button>
    </div>
  </div>

  <!-- Filter Bar & Search -->
  <div class="glass-card" style="padding:0.75rem 0.85rem;">
    
    <div style="display:flex;align-items:center;gap:0.75rem;margin-bottom:0.6rem;width:100%;">
      <div style="flex:1;min-width:0;width:100%;position:relative;">
        <span style="position:absolute;left:0.75rem;top:50%;transform:translateY(-50%);color:#64748b;font-size:0.85rem;">🔍</span>
        <input type="text" id="vaultSearchInput" class="global-search-input" style="padding-left:2.25rem;height:36px;font-size:0.82rem;" placeholder="Search filename, tags, or description..." oninput="handleVaultSearchInput(this)">
      </div>
    </div>

    <!-- Filter Chips -->
    <div class="filter-chips-scroll">
      <button class="filter-chip active" data-type="all" onclick="setTypeFilter('all')">All</button>
      <button class="filter-chip" data-type="dwg" onclick="setTypeFilter('dwg')">📐 DWG</button>
      <button class="filter-chip" data-type="dxf" onclick="setTypeFilter('dxf')">📐 DXF</button>
      <button class="filter-chip" data-type="sldprt" onclick="setTypeFilter('sldprt')">🛠 SLDPRT</button>
      <button class="filter-chip" data-type="sldasm" onclick="setTypeFilter('sldasm')">🛠 SLDASM</button>
      <button class="filter-chip" data-type="slddrw" onclick="setTypeFilter('slddrw')">🛠 SLDDRW</button>
      <button class="filter-chip" data-type="pdf" onclick="setTypeFilter('pdf')">📄 PDF</button>
      <button class="filter-chip" data-type="documents" onclick="setTypeFilter('documents')">📊 BOQ</button>
      <button class="filter-chip" data-type="images" onclick="setTypeFilter('images')">🖼 Images</button>
      <button class="filter-chip" data-type="code" onclick="setTypeFilter('code')">💻 Code</button>
      <button class="filter-chip" data-type="favorite" onclick="setTypeFilter('favorite')">⭐ Starred</button>
    </div>

  </div>

  <!-- Main Files Container -->
  <div id="vaultFilesContainer" style="width:100%;box-sizing:border-box;">
    <!-- Populated by static/js/vault.js -->
  </div>

</div>

<!-- Floating Bulk Actions Bar -->
<div class="bulk-bar" id="bulkActionBar">
  <span id="bulkSelectedCount" style="font-size:0.78rem;font-weight:600;color:#fff;">0 selected</span>
  <div style="display:flex;gap:0.4rem;">
    <button class="btn btn-secondary btn-sm" onclick="handleBulkDownload()">
      <span>⬇️</span> ZIP
    </button>
    <button class="btn btn-secondary btn-sm" onclick="openBulkMoveModal()">
      <span>📁</span> Move
    </button>
    <button class="btn btn-danger btn-sm" onclick="handleBulkDelete()">
      <span>🗑️</span> Delete
    </button>
  </div>
</div>
{% endblock %}
